<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palabras Inmortales del Alma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            font-family: "Cinzel", serif;
            padding: 20px;
        }

        .banner {
            position: relative;
            width: 100%;
            max-width: 900px;
            padding: 70px 50px;
            background: radial-gradient(circle at center, #fdfbf7 0%, #f0eadd 80%, #e3d8c1 100%);
            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.6),
                inset 0 0 80px rgba(139, 115, 85, 0.15);
            text-align: center;
            border: 1px solid #d4c5a9;
            overflow: hidden;
        }

        .texture-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 25px 0;
            color: #b08d55;
            font-size: 1.2rem;
            letter-spacing: 8px;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            width: 120px;
            background: linear-gradient(90deg, transparent, #b08d55, transparent);
            margin: 0 15px;
        }

        .divider span {
            font-size: 1.5rem;
        }

        h1 {
            color: #1a1a1a;
            font-weight: 600;
            line-height: 1.4;
            text-transform: uppercase;
        }

        .line-1,
        .line-2,
        .line-3 {
            display: block;
        }

        .line-1 {
            font-size: 2.2rem;
            letter-spacing: 10px;
            color: #3a3a3a;
            font-weight: 400;
        }

        .line-2 {
            font-size: 4.5rem;
            letter-spacing: 8px;
            color: #111;
            margin: 15px 0;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.08);
        }

        .line-3 {
            font-size: 2.2rem;
            letter-spacing: 10px;
            color: #3a3a3a;
            font-weight: 400;
            font-family: "Cormorant Garamond", serif;
            font-style: italic;
            text-transform: none;
            letter-spacing: 6px;
        }

        @media (max-width: 768px) {
            .banner { padding: 50px 20px; }
            .line-1 { font-size: 1.5rem; letter-spacing: 6px; }
            .line-2 { font-size: 2.15rem; letter-spacing: 2px; }
            .line-3 { font-size: 1.5rem; letter-spacing: 4px; }
            .divider::before, .divider::after { width: 60px; }
        }
    </style>
</head>
<body>
    <div class="banner">
        <div class="texture-overlay"></div>
        <div class="content">
            <div class="divider"><span>❦</span></div>
            <h1>
                <span class="line-1">Palabras</span>
                <span class="line-2">Inmortales</span>
                <span class="line-3">del Alma</span>
            </h1>
            <div class="divider"><span>❦</span></div>
        </div>
    </div>
</body>
</html>
